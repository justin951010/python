{% extends "navbar.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="py-5" style="background-color: #f1f3f5; min-height: calc(100vh - 56px); font-family: sans-serif;">
    <div class="container" style="max-width: 750px;">
        
        <div class="card p-5 border-0 mb-4" style="border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); background: white;">
            <div class="text-center mb-4">
                <span style="font-size: 3rem;">🚀</span>
                <h2 class="fw-bold mt-2" style="color: #1a1a1a;">召喚師真實數據傳送門</h2>
                <p class="text-muted">輸入名稱與標籤，系統將自動校對格式，為您建立直達官方的真實數據通道</p>
            </div>
            
            <form action="/lol_search" method="POST" class="d-flex gap-2">
                <input type="text" name="player_id" class="form-control form-control-lg px-4" style="border-radius: 10px;" placeholder="請輸入完整名稱 (例如: 台灣犽宿神#TW2)" value="{{ player_id }}" required>
                <button type="submit" class="btn btn-primary btn-lg px-5 fw-bold" style="background-color: #4b69ff; border: none; border-radius: 10px;">建立通道</button>
            </form>
        </div>

        {% if opgg_url %}
        <div class="card p-4 border-0 text-center animate-fade-in" style="border-radius: 16px; box-shadow: 0 6px 24px rgba(75, 105, 255, 0.12); background: white; border: 2px solid #eef2ff;">
            <div class="py-3">
                <span class="badge bg-success px-3 py-2 fs-6 mb-3" style="background-color: #22c55e !important;">✨ 官方連結生成成功</span>
                <h4 class="fw-bold text-dark">已成功鎖定召喚師：<span class="text-primary">{{ player_id }}</span></h4>
                <p class="text-muted small px-3">點擊下方按鈕將在新視窗打開官方最準確的 KDA、近期常用角色及勝率。<strong>您目前的開發網頁和黑色導覽列將安穩保留在原地。</strong></p>
            </div>
            
            <div class="p-3 bg-light rounded-3 mb-4 border text-truncate">
                <span class="text-muted d-block small mb-1">🔗 安全加密目標網址</span>
                <code class="text-secondary" style="font-size: 0.95rem;">{{ opgg_url }}</code>
            </div>

            <a href="{{ opgg_url }}" target="_blank" class="btn btn-lg btn-primary w-100 py-3 fw-bold shadow-sm" style="background-color: #4b69ff; border: none; border-radius: 10px; font-size: 1.1rem;">
                🎯 開啟真實戰績傳送門 ↗
            </a>
        </div>
        {% endif %}

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
